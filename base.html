<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Voice Messaging System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Modern voice-based messaging system for visually impaired users">
</head>

<body>
    <!-- Floating particles for visual effect -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header role="banner" class="main-header">
        <nav role="navigation" aria-label="Main navigation" class="main-nav">
            <div class="nav-brand">
                <span class="brand-icon">🎤</span>
                <span class="brand-text">VoiceMsg</span>
            </div>
            {% if current_user and current_user.is_authenticated %}
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/compose" class="nav-link">Compose</a>
                <a href="/inbox" class="nav-link">Inbox</a>
                <button id="globalLogout" class="nav-link logout-btn">Logout</button>
            </div>
            {% endif %}
        </nav>
    </header>

    <main role="main" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer role="contentinfo" class="main-footer">
        <div class="footer-content">
            <p>&copy; 2025 Voice Messaging System. Designed for accessibility.</p>
            <div class="footer-links">
                <a href="#" class="footer-link">Privacy</a>
                <a href="#" class="footer-link">Terms</a>
                <a href="#" class="footer-link">Support</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/voice-interface.js') }}"></script>
    {% block scripts %}{% endblock %}

    <style>
        /* Additional modern styles for base template */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float-particle 20s infinite linear;
        }

        .particle:nth-child(1) {
            left: 20%;
            animation-delay: 0s;
            animation-duration: 15s;
        }

        .particle:nth-child(2) {
            left: 40%;
            animation-delay: 2s;
            animation-duration: 18s;
        }

        .particle:nth-child(3) {
            left: 60%;
            animation-delay: 4s;
            animation-duration: 22s;
        }

        .particle:nth-child(4) {
            left: 80%;
            animation-delay: 6s;
            animation-duration: 16s;
        }

        .particle:nth-child(5) {
            left: 90%;
            animation-delay: 8s;
            animation-duration: 20s;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .main-header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .brand-icon {
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: var(--transition);
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .logout-btn {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.3);
        }

        .main-footer {
            margin-top: 4rem;
            padding: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-content p {
            color: var(--text-secondary);
            margin: 0;
        }

        .footer-links {
            display: flex;
            gap: 1rem;
        }

        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .footer-link:hover {
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .main-nav {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>

    <script>
        // Global logout functionality
        document.addEventListener('DOMContentLoaded', function () {
            const logoutBtn = document.getElementById('globalLogout');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function () {
                    try {
                        const sessionToken = localStorage.getItem('session_token');
                        const response = await fetch('/api/auth/logout', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${sessionToken}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        localStorage.removeItem('session_token');
                        window.location.href = '/';
                    } catch (error) {
                        console.error('Logout error:', error);
                        window.location.href = '/';
                    }
                });
            }
        });
    </script>
</body>

</html>
